  <path d="M11 46c-2-8 3-15 11-17-5 4-6 10-3 15 2 3 5 5 8 5-6 5-14 3-16-3Z" fill="#ffda63"/>
  <path d="M12 43c0-7 4-11 10-13" fill="none" stroke="#8d3708" stroke-width="2" stroke-linecap="round"/>

  <!-- 몸과 얼굴: 작은 크기에서도 귀·눈·주둥이가 분리됨 -->
  <ellipse cx="36" cy="45" rx="12" ry="13" fill="url(#squirrel-gold)" stroke="#4e2208" stroke-width="2.1"/>
  <circle cx="41" cy="27" r="11" fill="url(#squirrel-gold)" stroke="#4e2208" stroke-width="2.1"/>
  <path d="m34 20 1-9 8 7M43 18l7-7-1 11" fill="#e88715" stroke="#4e2208" stroke-width="2.1" stroke-linejoin="round"/>
  <ellipse cx="47.5" cy="31" rx="8.2" ry="6" fill="#ffe7a0" stroke="#4e2208" stroke-width="1.7"/>
  <circle cx="42.5" cy="25.5" r="2.3" fill="#111526"/>
  <circle cx="43.2" cy="24.8" r=".75" fill="#fff"/>
  <circle cx="54.5" cy="30.5" r="2.1" fill="#161221"/>
  <path d="M49 35c-1 3-4 4-7 3" fill="none" stroke="#5a2208" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 밝은 배와 두 손에 든 도토리 -->
  <path d="M30 43c2-5 8-6 12-2 3 4 2 10-2 15-7 1-12-4-10-13Z" fill="#ffe79a"/>
  <path d="M29 39c-4 1-6 4-6 7M42 39c4 1 6 4 6 7" fill="none" stroke="#7b2f08" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M32 42c0-3 2-5 5-5s5 2 5 5v7H32Z" fill="#9b4b13" stroke="#4e2208" stroke-width="1.5"/>
