<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="왕관을 쓴 황금 다람쥐 모두다담 총관리자">
  <defs>
    <radialGradient id="admin-bg" cx="50%" cy="42%" r="62%">
      <stop stop-color="#43300c"/>
      <stop offset=".58" stop-color="#171426"/>
      <stop offset="1" stop-color="#070912"/>
    </radialGradient>
    <linearGradient id="squirrel-gold" x1="18" y1="15" x2="48" y2="56">
      <stop stop-color="#ffd84c"/>
      <stop offset=".52" stop-color="#e98a16"/>
      <stop offset="1" stop-color="#b94f0b"/>
    </linearGradient>
    <linearGradient id="tail-gold" x1="7" y1="19" x2="31" y2="56">
      <stop stop-color="#ffc83a"/>
      <stop offset=".5" stop-color="#de7512"/>
      <stop offset="1" stop-color="#9d3e08"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="29" fill="url(#admin-bg)" stroke="#ffd84c" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#fff1a0" stroke-opacity=".38"/>

  <!-- 한눈에 보이는 크고 둥근 꼬리 -->
