  <path d="M12 45c-3-7 1-13 8-13-4 3-4 8 1 11-3 2-6 3-9 2Z" fill="#8b4308" opacity=".42"/>

  <!-- 황금 다람쥐 -->
  <ellipse cx="35" cy="43" rx="11" ry="13" fill="url(#master-gold)" stroke="#fff3a4" stroke-width="1.4"/>
  <circle cx="40" cy="28" r="10" fill="url(#master-gold)" stroke="#fff3a4" stroke-width="1.4"/>
  <path d="m34 21 2-7 6 6M43 20l5-6 1 9" fill="url(#master-gold)" stroke="#fff3a4" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M47 28c5 0 8 2 9 5-3 3-8 3-12 1Z" fill="#f7b525" stroke="#fff3a4" stroke-width="1.2"/>
  <path d="M32 39c4 2 7 7 7 13-6 2-11-1-12-6Z" fill="#fff2a0" opacity=".72"/>
  <circle cx="42.5" cy="26.5" r="2" fill="#111526"/>
  <circle cx="43.1" cy="25.9" r=".65" fill="#fff"/>
  <circle cx="53" cy="31.5" r="1.4" fill="#211426"/>
  <path d="M43 36c2 2 4 2 6 .5" fill="none" stroke="#7c3309" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M28 39c-4 1-6 4-7 7M39 39c4 1 6 3 7 6" fill="none" stroke="#f5ac1b" stroke-width="3.2" stroke-linecap="round"/>

  <!-- 가슴의 관리자 전용 인장 -->
  <path d="M32 38 38 40v5c0 4-2.3 7-6 9-3.7-2-6-5-6-9v-5Z" fill="#101a36" stroke="#fff3a4" stroke-width="1.2"/>
  <path d="m32 41 1.1 2.2 2.5.4-1.8 1.8.4 2.5-2.2-1.2-2.2 1.2.4-2.5-1.8-1.8 2.5-.4Z" fill="#ffd640"/>

  <g fill="#fff7b8">
    <circle cx="18" cy="17" r="1.4"/>
    <circle cx="52" cy="21" r="1.2"/>
    <circle cx="17" cy="52" r="1"/>
    <circle cx="50" cy="49" r="1.5"/>
  </g>
