<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="황금 다람쥐 모두다담 총관리자">
  <defs>
    <radialGradient id="master-aura" cx="50%" cy="43%" r="58%">
      <stop offset="0" stop-color="#5f3c08"/>
      <stop offset=".58" stop-color="#171426"/>
      <stop offset="1" stop-color="#070912"/>
    </radialGradient>
    <linearGradient id="master-gold" x1="12" y1="8" x2="51" y2="57">
      <stop stop-color="#fff7ad"/>
      <stop offset=".24" stop-color="#ffd84c"/>
      <stop offset=".58" stop-color="#f2a51c"/>
      <stop offset="1" stop-color="#a84c08"/>
    </linearGradient>
    <linearGradient id="master-tail" x1="8" y1="20" x2="31" y2="55">
      <stop stop-color="#fff2a0"/>
      <stop offset=".45" stop-color="#f9b725"/>
      <stop offset="1" stop-color="#c5680c"/>
    </linearGradient>
    <filter id="master-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#ffd43d" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#08040c" flood-opacity=".95"/>
    </filter>
  </defs>

  <g fill="#ffd640" opacity=".95">
    <path d="m32 1 2 5-2 5-2-5Z"/>
    <path d="m8 12 4 3-1 5-4-3Z"/>
    <path d="m56 12-4 3 1 5 4-3Z"/>
    <path d="m4 37 5-2 4 3-5 2Z"/>
    <path d="m60 37-5-2-4 3 5 2Z"/>
    <path d="m13 56 3-5 5 1-3 5Z"/>
    <path d="m51 56-3-5-5 1 3 5Z"/>
  </g>

  <circle cx="32" cy="33" r="27" fill="url(#master-aura)" stroke="url(#master-gold)" stroke-width="2.3" filter="url(#master-glow)"/>
  <circle cx="32" cy="33" r="23" fill="none" stroke="#fff2a0" stroke-opacity=".35"/>

  <!-- 왕관: 단 하나의 최고 관리자 권한 -->
  <path d="m28 17-2-7 5 3 3-7 3 7 6-3-2 8Z" fill="url(#master-gold)" stroke="#fff7b8" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M28 18h13" stroke="#fff7b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 크고 밝은 꼬리로 다람쥐 실루엣을 분명하게 표현 -->
